name: EABC Python Tests

on:
  push:
    paths:
      - "eabc_from_lean.py"
      - "collatz_eabc_brachistochrone.py"
      - "collatz_eabc_bell_inequality_test.py"
      - "tests/test_eabc_from_lean.py"
      - "tests/test_eabc_brachistochrone.py"
      - "tests/test_eabc_bell_inequality.py"
      - ".github/workflows/eabc-python-tests.yml"
  pull_request:
    paths:
      - "eabc_from_lean.py"
      - "collatz_eabc_brachistochrone.py"
      - "collatz_eabc_bell_inequality_test.py"
      - "tests/test_eabc_from_lean.py"
      - "tests/test_eabc_brachistochrone.py"
      - "tests/test_eabc_bell_inequality.py"
      - ".github/workflows/eabc-python-tests.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check eabc_from_lean.py collatz_eabc_brachistochrone.py collatz_eabc_bell_inequality_test.py tests/
      - run: black --check eabc_from_lean.py collatz_eabc_brachistochrone.py collatz_eabc_bell_inequality_test.py tests/
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/test_eabc_from_lean.py tests/test_eabc_brachistochrone.py tests/test_eabc_bell_inequality.py -q
