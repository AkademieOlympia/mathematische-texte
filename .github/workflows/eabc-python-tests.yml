name: EABC Python Tests

on:
  push:
    paths:
      - "eabc_from_lean.py"
      - "collatz_eabc_holonomie_test.py"
      - "collatz_eabc_transition_graph.py"
      - "collatz_eabc_holonomie_fehlerterm.py"
      - "collatz_eabc_sagnac_circulation.py"
      - "collatz_eabc_graph_laplacian.py"
      - "collatz_eabc_bell_inequality_test.py"
      - "collatz_eabc_D_growth.py"
      - "collatz_eabc_kritische_abbildung.py"
      - "collatz_eabc_brachistochrone.py"
      - "collatz_eabc_chirale_transport.py"
      - "collatz_eabc_wigner_field.py"
      - "tests/test_eabc_from_lean.py"
      - "tests/test_eabc_holonomie.py"
      - "tests/test_eabc_transition_graph.py"
      - "tests/test_eabc_holonomie_fehlerterm.py"
      - "tests/test_eabc_sagnac_circulation.py"
      - "tests/test_eabc_graph_laplacian.py"
      - "tests/test_eabc_bell_inequality.py"
      - "tests/test_eabc_D_growth.py"
      - "tests/test_eabc_kritische_abbildung.py"
      - "tests/test_eabc_brachistochrone.py"
      - "tests/test_eabc_chirale_transport.py"
      - "tests/test_eabc_wigner_field.py"
      - "collatz_eabc_core/CollatzEabc/HolonomieFehlerterm.lean"
      - ".github/workflows/eabc-python-tests.yml"
  pull_request:
    paths:
      - "eabc_from_lean.py"
      - "collatz_eabc_holonomie_test.py"
      - "collatz_eabc_transition_graph.py"
      - "collatz_eabc_holonomie_fehlerterm.py"
      - "collatz_eabc_sagnac_circulation.py"
      - "collatz_eabc_graph_laplacian.py"
      - "collatz_eabc_bell_inequality_test.py"
      - "collatz_eabc_D_growth.py"
      - "collatz_eabc_kritische_abbildung.py"
      - "collatz_eabc_brachistochrone.py"
      - "collatz_eabc_chirale_transport.py"
      - "collatz_eabc_wigner_field.py"
      - "tests/test_eabc_from_lean.py"
      - "tests/test_eabc_holonomie.py"
      - "tests/test_eabc_transition_graph.py"
      - "tests/test_eabc_holonomie_fehlerterm.py"
      - "tests/test_eabc_sagnac_circulation.py"
      - "tests/test_eabc_graph_laplacian.py"
      - "tests/test_eabc_bell_inequality.py"
      - "tests/test_eabc_D_growth.py"
      - "tests/test_eabc_kritische_abbildung.py"
      - "tests/test_eabc_brachistochrone.py"
      - "tests/test_eabc_chirale_transport.py"
      - "tests/test_eabc_wigner_field.py"
      - "collatz_eabc_core/CollatzEabc/HolonomieFehlerterm.lean"
      - ".github/workflows/eabc-python-tests.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black

      - name: Run ruff
        run: ruff check eabc_from_lean.py collatz_eabc_holonomie_test.py collatz_eabc_transition_graph.py collatz_eabc_holonomie_fehlerterm.py collatz_eabc_sagnac_circulation.py collatz_eabc_graph_laplacian.py collatz_eabc_bell_inequality_test.py collatz_eabc_D_growth.py collatz_eabc_kritische_abbildung.py collatz_eabc_brachistochrone.py collatz_eabc_chirale_transport.py collatz_eabc_wigner_field.py tests/

      - name: Run black check
        run: black --check eabc_from_lean.py collatz_eabc_holonomie_test.py collatz_eabc_transition_graph.py collatz_eabc_holonomie_fehlerterm.py collatz_eabc_sagnac_circulation.py collatz_eabc_graph_laplacian.py collatz_eabc_bell_inequality_test.py collatz_eabc_D_growth.py collatz_eabc_kritische_abbildung.py collatz_eabc_brachistochrone.py collatz_eabc_chirale_transport.py collatz_eabc_wigner_field.py tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run EABC tests
        run: pytest tests/test_eabc_from_lean.py tests/test_eabc_holonomie.py tests/test_eabc_transition_graph.py tests/test_eabc_holonomie_fehlerterm.py tests/test_eabc_sagnac_circulation.py tests/test_eabc_graph_laplacian.py tests/test_eabc_bell_inequality.py tests/test_eabc_D_growth.py tests/test_eabc_kritische_abbildung.py tests/test_eabc_brachistochrone.py tests/test_eabc_chirale_transport.py tests/test_eabc_wigner_field.py -q
